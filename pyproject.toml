[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "scopiengine"
version = "1.0.0"
description = "Search and analytics engine with the Elasticsearch mental model, pluggable storage and resilient log ingestion"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Alperen CK", email = "alprncck17@gmail.com" }]
maintainers = [{ name = "Alperen CK", email = "alprncck17@gmail.com" }]
keywords = ["search", "analytics", "inverted-index", "full-text-search", "logs", "bm25"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
mssql = ["pyodbc>=5.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/AlperenCK/ScopiEngine"
Repository = "https://github.com/AlperenCK/ScopiEngine"
Issues = "https://github.com/AlperenCK/ScopiEngine/issues"
Changelog = "https://github.com/AlperenCK/ScopiEngine/blob/main/CHANGELOG.md"

[project.scripts]
scopi = "scopiengine.cli.main:run"
scopiengine = "scopiengine.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/scopiengine"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/scopiengine"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true


[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests, deselect with '-m \"not slow\"'",
    "mssql: requires a reachable MS SQL Server via SCOPI_TEST_MSSQL_DSN",
]

[tool.coverage.run]
source = ["src/scopiengine"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
