name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -m "not slow and not mssql" --cov --cov-report=term-missing

  mssql:
    name: Tests (MS SQL Server)
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ScopiTest_2026Pw"
          MSSQL_PID: "Developer"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ScopiTest_2026Pw -Q 'SELECT 1' || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Microsoft ODBC driver
        run: |
          curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev mssql-tools18
          echo "/opt/mssql-tools18/bin" >> "$GITHUB_PATH"
      - name: Install
        run: pip install -e ".[dev,mssql]"
      - name: Create test database
        run: |
          sqlcmd -C -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -Q "IF DB_ID('scopi') IS NULL CREATE DATABASE scopi"
        env:
          MSSQL_SA_PASSWORD: "ScopiTest_2026Pw"
      - name: Smoke test the connection
        run: scopi -s "$SCOPI_TEST_MSSQL_DSN" storage init && scopi -s "$SCOPI_TEST_MSSQL_DSN" storage info
        env:
          SCOPI_TEST_MSSQL_DSN: "mssql://sa:ScopiTest_2026Pw@localhost:1433/scopi?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      - name: Pytest (mssql)
        # shell: bash runs with -eo pipefail, so a failing pytest is not masked by tee.
        shell: bash
        run: pytest -m mssql --tb=short -q | tee pytest-mssql.log
        env:
          SCOPI_TEST_MSSQL_DSN: "mssql://sa:ScopiTest_2026Pw@localhost:1433/scopi?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes"
      - name: Failure summary
        # The service container dumps its whole error log at teardown, which buries
        # the test output. Repeat the failures here so they stay findable.
        if: failure()
        run: |
          echo "===== SCOPI MSSQL FAILURES ====="
          tail -n 60 pytest-mssql.log || echo "no pytest log was produced"
          echo "===== END SCOPI MSSQL FAILURES ====="

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: pip install build twine
      - name: Build
        run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
